experiment:
  name: demo_record_emergence
  seed: 42
  description: Maximum local demo hunt for life (~5 min with C backend, ~34M interactions). Same scale as 5min_stress_test with full life metrics.
  output_dir: "./chronicle/{name}_{timestamp}"

chaos:
  size: 512
  tape_length: 64

aether:
  backend: c
  max_steps_per_interaction: 350
  interactions_total: 34000000
  checkpoint_every: 2000000

metrics:
  log_interval: 500000
  metrics_enabled:
    - entropy
    - instruction_density
    - compression_ratio
    - life_criteria
    - top_replicators
    - phase_detector
  top_replicators_n: 20
  life_criteria_thresholds:
    instruction_density: 0.1
    replicator_fraction: 0.05
    compression_ratio: 0.8

logging:
  level: info
  live_display: true
