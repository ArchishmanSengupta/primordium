experiment:
  name: demo_record_long
  seed: 42
  description: Longer demo run (~2-3 min with C backend). Better chance of phase-transition signals than template_quick.
  output_dir: "./chronicle/{name}_{timestamp}"

chaos:
  size: 512
  tape_length: 64

aether:
  backend: c
  max_steps_per_interaction: 350
  interactions_total: 20000000
  checkpoint_every: 5000000

metrics:
  log_interval: 500000
  metrics_enabled:
    - entropy
    - instruction_density
    - compression_ratio
    - life_criteria
    - top_replicators
  top_replicators_n: 10
  life_criteria_thresholds:
    instruction_density: 0.1
    replicator_fraction: 0.05
    compression_ratio: 0.8

logging:
  level: info
  live_display: true
